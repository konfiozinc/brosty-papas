# ═══════════════════════════════════════════════════════════════════════
#  GitHub Pages · qué se publica de este repositorio
#  KZ-BROSTY-004
#
#  Pages sirve la RAÍZ del repositorio. Este archivo recorta el artefacto a lo
#  que el sitio necesita: la página, sus recursos y el logo.
#
#  Queda fuera de la publicación todo lo interno: las herramientas de prueba,
#  las capturas y los informes. Nada de eso se borra del repositorio: solo deja
#  de servirse en el sitio público.
#
#  Importante: al definir `exclude` se sustituye la lista por omisión de Jekyll,
#  por eso se repiten aquí sus entradas.
# ═══════════════════════════════════════════════════════════════════════

title: BROSTY PAPAS — Pollo Broaster y Asado
description: Pollo broaster y asado, combos, salchipapas y limonadas. Pedidos por WhatsApp.

exclude:
  # Lista por omisión de Jekyll
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - node_modules
  - vendor

  # Interno de KONFÍO ZINC / del proyecto: nunca se sirve
  - herramientas
  - evidencias
  - LEEME-REVISION.txt
  - README.md
  - .gitignore
  - logobrosty.jpeg
